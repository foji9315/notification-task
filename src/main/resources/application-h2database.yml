spring:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  datasource:
    driverClassName: org.h2.Driver
    url: jdbc:h2:file:./db/notificationDb
    maximum-pool-size: 10
    minimum-idle: 2
    idle-timeout: 30000
    connection-timeout: 5000
  liquibase:
    contexts: all, minimalData, development
    change-log: classpath:liquibase/master.changelog.xml
    parameters:
      schemaName: PUBLIC
      appUser: sa
      dbType: h2