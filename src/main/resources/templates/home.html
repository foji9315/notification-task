<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Notification UI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>

<div class="col-lg-8 mx-auto p-3 py-md-5">
  <header class="d-flex align-items-center pb-3 mb-5 border-bottom">
    <a href="/" class="d-flex align-items-center text-dark text-decoration-none">
      <span class="fs-4">Notification User Interface</span>
    </a>
  </header>
  <div th:if="${successMessage}" class="alert alert-primary"  role="alert">
    <p th:text="${successMessage}"></p>
  </div>
  <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
    <p th:text="${errorMessage}"></p>
  </div>
   <main>
     <h3>Post new message</h3>
     <div class="row g-5">
       <form  th:object="${messageFormModel}" action="/messages" method="POST">
         <div class="row g-3">
           <div class="col-md-5">
             <label for="category" class="form-label">Category:</label>
             <select class="form-select" id="country" required="" th:field="*{category}">
               <option value="">Select a category</option>
               <option class="text-capitalize" th:each="option : ${categories}" th:value="${option}" th:text="${option}"></option>
             </select>
             <div class="invalid-feedback">
               Please select a valid country.
             </div>
           </div>

           <div class="col-12">
             <label for="message" class="form-label">Message: </label>
             <textarea class="form-control" rows="3" th:field="*{message}"></textarea>
           </div>
         </div>
         <hr class="my-4">
         <button class="w-100 btn btn-primary btn-lg" type="submit">Post</button>
       </form>
     </div>

     <hr class="col-3 col-md-2 mb-5">

     <h3>Latest messages published</h3>
     <div class="row g-5">

       <div th:each="item : ${publishedMessages}" class="card mb-3">
         <div class="card-body">
           <h5 class="card-title" th:text="'Category: ' + ${item.category}"> </h5>
           <p class="card-text" th:text="'Message: ' + ${item.message}"></p>
           <p class="card-text"><small class="text-muted" th:text="'Post Date: ' + ${item.createdAt}"></small></p>
         </div>
       </div>

     </div>
   </main>
</div>

</body>
</html>
