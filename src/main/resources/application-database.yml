spring:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  datasource:
    driverClassName: org.h2.Driver
    url: jdbc:h2:file:./db/notificationDb
  liquibase:
    contexts: all, minimalData, development
    change-log: classpath:liquibase/master.changelog.xml
    parameters:
      schemaName: PUBLIC
      appUser: sa
      dbType: h2